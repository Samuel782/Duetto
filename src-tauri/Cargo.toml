[package]
name = "duetto-tauri"
version = "0.0.1"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = "2"

[dependencies]
base64 = "0.23.1"
cpal = "0.18"
getrandom = "0.3"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }
serde_json = "1.0.154"
sys-locale = "0.3"
tauri = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

[features]
# Attiva quando il pacchetto si compila senza la CLI di Tauri.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = "thin"
opt-level = "s"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
