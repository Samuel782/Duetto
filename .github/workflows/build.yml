# Crea i pacchetti di Duetto sui Mac di GitHub, come "npm run dist" sul computer.
# Parte a mano da Actions → "Pacchetti" → "Run workflow", oppure da sola con un tag v1.2.2 e simili.
# I file finiscono tra gli artefatti dell'esecuzione: la release su GitHub resta da fare a mano.
name: Pacchetti

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Mac (Apple e Intel)
        run: npx electron-builder --mac --publish never

      - name: Windows
        run: npx electron-builder --win --publish never

      - name: Elenco dei componenti (SBOM)
        run: npm run sbom

      - uses: actions/upload-artifact@v7
        with:
          name: Duetto
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.cdx.json
          if-no-files-found: error
          retention-days: 30
